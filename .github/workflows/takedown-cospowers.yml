name: Takedown cospowers (one-shot)

# Emergency takedown: cospowers must not be open-sourced. Deletes the Gitea
# mirror repo and strips the entry from the Gitea marketplace index. The GitHub
# side is handled directly (repo already private; index edited separately).
# This workflow is temporary and will be removed once verification passes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  takedown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_USER: ${{ vars.GITEA_USER }}
      API: https://gitea.costrict.ai/api/v1
    steps:
      - name: Delete Gitea mirror repo
        run: |
          set -euo pipefail
          [ -n "${GITEA_TOKEN:-}" ] || { echo "::error::GITEA_TOKEN missing"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "$API/repos/costrict-plugins-repo/cospowers" \
            -H "Authorization: token $GITEA_TOKEN")
          echo "DELETE cospowers → HTTP $code (204=deleted, 404=already gone)"
          [ "$code" = "204" ] || [ "$code" = "404" ]

      - name: Strip cospowers from Gitea marketplace index
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://${GITEA_USER}:${GITEA_TOKEN}@gitea.costrict.ai/costrict-plugins-repo/marketplace.git" /tmp/mp
          cd /tmp/mp
          before=$(jq '.plugins|length' .claude-plugin/marketplace.json)
          jq '.plugins |= map(select(.name != "cospowers"))' \
            .claude-plugin/marketplace.json > /tmp/m.json
          after=$(jq '.plugins|length' /tmp/m.json)
          echo "index entries: $before -> $after"
          if [ "$before" = "$after" ]; then echo "already clean"; exit 0; fi
          mv /tmp/m.json .claude-plugin/marketplace.json
          git config user.name  costrict-build
          git config user.email build@costrict.local
          git add .claude-plugin/marketplace.json
          git commit -q -m "takedown: remove cospowers from marketplace index"
          git push -q origin HEAD:main
          echo "index pushed"

      - name: Verify from anonymous view
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://gitea.costrict.ai/api/v1/repos/costrict-plugins-repo/cospowers)
          echo "anonymous repo lookup → HTTP $code (expect 404)"
          [ "$code" = "404" ]
          n=$(curl -s "https://gitea.costrict.ai/costrict-plugins-repo/marketplace/raw/branch/main/.claude-plugin/marketplace.json" | jq '[.plugins[]|select(.name=="cospowers")]|length')
          echo "cospowers entries left in index: $n (expect 0)"
          [ "$n" = "0" ]
