name: Sync csc-plugins (cospowers, first-party)

# Manual re-sync of the 6 first-party cospowers plugins from
# https://github.com/yhangf/csc-plugins. Unlike the bulk publish path
# (publish.sh --skip-existing, which SKIPS already-published repos and so never
# updates their content), this workflow **force-mirrors** the cospowers plugin
# repos so a re-run actually ships the latest content.
#
# Steps:
#   1. sync_plugins_csc.py --overlay-catalog-index → upsert the 6 entries into
#      catalog/plugins/index.json (per-type) + catalog/index.json (top-level),
#      preserving every other entry's enrichment. Commit + push.
#   2. Targeted force-publish: check out the marketplace repo, build ONLY the 6
#      cospowers bare repos (full content — build.py honors prune_content=false),
#      then publish.sh --skip-marketplace (force --mirror, NO --skip-existing) so
#      costrict-plugins-repo/<id>.git always reflects the latest source.
#   3. (optional) trigger the full release-catalog-bundle so the marketplace.json
#      index + web catalog-bundle also refresh (needed when plugins are
#      ADDED/REMOVED, or to refresh web hub visibility).
#
# Re-run anytime csc-plugins updates: the script + build re-read the live tree.
#
# PREVIEW MODE (csc_branch != 'main'): pull the cospowers from a csc-plugins
# feature branch/tag to validate it BEFORE it merges to main. In this mode the
# workflow force-publishes the marketplace repos from that ref (so
# `csc plugin install <name>@costrict-plugins` and the web hub's install both
# fetch the branch content) but does NOT commit the canonical catalog index or
# trigger a full release — so the reviewed main catalog metadata stays clean.
# Re-run with csc_branch=main to restore the marketplace repos to main content.

on:
  workflow_dispatch:
    inputs:
      csc_branch:
        description: "csc-plugins ref (branch/tag) to sync from. Non-'main' = PREVIEW: force-publish marketplace repos from that ref WITHOUT committing the canonical catalog or full release. Re-run with 'main' to restore."
        required: false
        default: "main"
        type: string
      trigger_full_release:
        description: "Also trigger release-catalog-bundle (refresh marketplace.json index + web bundle). Needed when adding/removing a plugin. IGNORED unless csc_branch is 'main'."
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # commit + push the updated index files
  actions: write    # dispatch release-catalog-bundle.yaml

concurrency:
  group: sync-csc-plugins
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKETPLACE_REPO: costrict-plugins-repo/costrict-plugin-marketplace
      ORG: costrict-plugins-repo
    steps:
      - name: Checkout catalog repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync cospowers plugins (per-type + top-level overlay)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/sync_plugins_csc.py --overlay-catalog-index --branch "${{ inputs.csc_branch || 'main' }}"

      # PREVIEW guard: only main writes the canonical catalog. A feature-branch
      # run keeps the dev source_url in the local checkout (so force-publish
      # below clones the branch) but never commits it to the reviewed catalog.
      - name: Commit & push index changes
        if: ${{ (inputs.csc_branch || 'main') == 'main' }}
        run: |
          git config user.name  "costrict-build"
          git config user.email "build@costrict.local"
          git add catalog/plugins/index.json catalog/index.json
          if git diff --cached --quiet; then
            echo "No catalog changes — csc-plugins already up to date."
          else
            git commit -m "chore(catalog): sync cospowers plugins from yhangf/csc-plugins"
            git push
          fi

      - name: Preview-mode notice (catalog commit skipped)
        if: ${{ (inputs.csc_branch || 'main') != 'main' }}
        run: |
          echo "::notice title=Preview mode::csc_branch='${{ inputs.csc_branch }}' (not main) —"
          echo "skipping canonical catalog commit & full release; only force-publishing the"
          echo "marketplace repos from this ref. Re-run with csc_branch=main to restore."

      - name: Check out marketplace repo
        uses: actions/checkout@v4
        with:
          repository: costrict-plugins-repo/costrict-plugin-marketplace
          token: ${{ secrets.MARKETPLACE_GITHUB_TOKEN }}
          path: .marketplace
          fetch-depth: 1

      - name: Force-publish the cospowers plugin repos (full content)
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The 6 cospowers entries → a mini catalog build.py can consume.
          python3 - <<'PY'
          import json
          d = json.load(open("catalog/plugins/index.json"))
          csc = [e for e in d if e.get("source") == "csc-plugins"]
          json.dump(csc, open("/tmp/csc.json", "w"), ensure_ascii=False, indent=2)
          print(f"cospowers entries: {len(csc)} -> {[e['id'] for e in csc]}")
          PY
          VER="csc-${{ github.run_number }}"
          python3 .marketplace/scripts/build.py \
            --version "$VER" \
            --catalog /tmp/csc.json \
            --github-org "$ORG" \
            --workers 6 \
            --output /tmp/csc-build
          gh auth setup-git
          # --skip-marketplace: do NOT touch marketplace.git (a mini build would
          #   otherwise overwrite the full index with just these 6).
          # NO --skip-existing: force --mirror so existing repos get the new content.
          .marketplace/scripts/publish.sh "/tmp/csc-build/costrict-marketplace-bundle-v$VER" \
            --org "$ORG" \
            --skip-marketplace \
            --yes

      - name: Mirror cospowers to Gitea
        # Only on main: Gitea is the production client-default marketplace source, so
        # a preview run (csc_branch != main) must NOT force-mirror preview content to
        # it — that would shift the default channel for ALL clients. Preview stays
        # GitHub-side only; re-run with csc_branch=main to publish to Gitea.
        if: ${{ (inputs.csc_branch || 'main') == 'main' }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_USER: ${{ vars.GITEA_USER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Skip (not fail) when the Gitea secret is unconfigured. Gating inside the
          # script (rather than a step-level `if: secrets.GITEA_TOKEN != ''`) emits an
          # explicit skip line in the log and keeps the secret check next to its use.
          # The GitHub-side publish above is never affected by this step.
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo ">> GITEA_TOKEN not set — skipping Gitea mirror"
            exit 0
          fi
          if [ -z "${GITEA_USER:-}" ]; then
            echo "::error title=cospower Gitea mirror::GITEA_TOKEN set but GITEA_USER (repo variable) missing" >&2
            exit 1
          fi
          # Mirror the cospowers bare repos build.py just produced to the
          # self-hosted Gitea (gitea.costrict.ai), so the device-side default
          # marketplace source reflects this sync (clients default to Gitea).
          # The mini csc build contains ONLY the 6 cospowers repos; they already
          # exist on Gitea (no pre-create needed) and force-mirror is idempotent.
          # Skipped entirely when GITEA_TOKEN is unset → GitHub flow unaffected.
          BUNDLE="/tmp/csc-build/costrict-marketplace-bundle-vcsc-${{ github.run_number }}"
          BASE="https://${GITEA_USER}:${GITEA_TOKEN}@gitea.costrict.ai/costrict-plugins-repo"
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.postBuffer 524288000
          # Validate the repo set BEFORE pushing anything (nullglob → empty array if
          # the bundle is missing), so a wrong count fails loud without partial writes.
          bares=( "$BUNDLE"/repos/plugins/*.git )
          if [ "${#bares[@]}" -ne 6 ]; then
            echo "::error title=cospower Gitea mirror::expected 6 cospowers repos in bundle, found ${#bares[@]}" >&2
            exit 1
          fi
          for bare in "${bares[@]}"; do
            id="$(basename "$bare" .git)"
            echo "::group::mirror $id -> Gitea"
            git -C "$bare" push --force --mirror "$BASE/$id.git"
            echo "::endgroup::"
          done
          echo ">> mirrored ${#bares[@]} cospowers repos to Gitea"

      # Only on main: a full release rebuilds the bundle + marketplace.json from
      # the COMMITTED catalog (main), which would re-publish main content over
      # the preview force-publish above and undo the preview. So it is force-
      # skipped for any non-main ref even if the box was ticked.
      - name: (optional) Trigger Release Catalog Bundle
        if: ${{ inputs.trigger_full_release && (inputs.csc_branch || 'main') == 'main' }}
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-catalog-bundle.yaml --ref main -f publish_plugin_marketplace=true
          echo "Dispatched release-catalog-bundle (index + web bundle refresh)."

      - name: Full release skipped in preview mode
        if: ${{ inputs.trigger_full_release && (inputs.csc_branch || 'main') != 'main' }}
        run: |
          echo "::warning title=Full release skipped::trigger_full_release was requested but"
          echo "csc_branch='${{ inputs.csc_branch }}' is not main. A full release rebuilds from"
          echo "the main catalog and would overwrite the preview content — skipped on purpose."
