name: Release Catalog Bundle

# Builds dist/catalog-bundle.tar.gz from the current catalog/ + catalog-download/
# trees and publishes it as a GitHub Release asset for downstream consumers
# (e.g. costrict-web's CatalogIngestService).
#
# The bundle format is documented in scripts/build_catalog_bundle.md.
# Consumers pull a single tar.gz instead of cloning the whole repo.
#
# Triggers
# --------
# - push tag matching `catalog-bundle-v*`  → tag is the release name, the
#   download URL is stable and shareable. This is the canonical path.
# - workflow_dispatch                       → for ad-hoc rebuilds when no tag
#   is desired (e.g. validating a CI change). Creates a release tagged
#   `catalog-bundle-manual-<short-sha>` so it doesn't collide with the
#   canonical series.
#
# Notes
# -----
# - We run BOTH download_catalog.py and build_catalog_bundle.py here, so the
#   release artifact always reflects "what the source listings looked like
#   at this moment" rather than whatever stale catalog-download/ might be in
#   a developer's working tree. This matters because catalog-download/ is
#   gitignored.
# - download_catalog.py's reconciliation step rewrites catalog/index.json on
#   the runner — that change does NOT get committed back. It's a derived
#   artifact, only the bundle is published.

on:
  push:
    tags:
      - 'catalog-bundle-v*'
  workflow_dispatch:
    inputs:
      services_to_download:
        description: "Comma-list passed to download_catalog.py --types. Default: all"
        required: false
        default: "skills,mcp,rules,prompts,plugins,commands,subagents,templates"
      notes_extra:
        description: "Extra notes appended to the GitHub Release body"
        required: false
        default: ""
      publish_plugin_marketplace:
        description: "Publish the costrict plugin marketplace mirror from this bundle"
        required: false
        default: true
        type: boolean
      marketplace_version:
        description: "costrict-plugin-marketplace bundle SemVer without leading v. Defaults to catalog tag suffix/date."
        required: false
        default: ""
      manifest_webhook_url:
        description: "Send the manifest webhook here instead of COSTRICT_MANIFEST_WEBHOOK_URL. Must be https. The signing secret is unchanged, so the target must share it."
        required: false
        default: ""

permissions:
  contents: write   # required for `gh release create`

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Download can legitimately ride out a rate-limit wait; 30m killed it.
    timeout-minutes: 120
    outputs:
      release_tag: ${{ steps.tag.outputs.name }}
      bundle_sha: ${{ steps.bundle.outputs.sha256 }}
      index_sha: ${{ steps.bundle.outputs.index_sha256 }}
      manifest_sha: ${{ steps.registry-manifest.outputs.sha256 }}
      manifest_entry_count: ${{ steps.registry-manifest.outputs.entry_count }}
      marketplace_version: ${{ steps.marketplace-version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      # Cache download_catalog.py's transient state files so we don't re-hit
      # GitHub raw / mcp.so / mastra for every entry on every release run.
      # Keyed by ISO week so the cache rotates weekly along with upstream
      # source listings; per-day re-runs all hit the cache.
      - name: Compute weekly cache stamp
        id: stamp
        run: echo "value=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Restore download caches
        uses: actions/cache@v4
        with:
          path: |
            catalog/skills/.repo_cache.json
            catalog/skills/.llm_cache.json
            catalog/maintenance/incremental_recrawl_state.json
            scripts/fallback_skill_repos.json
            .skills_sh_cache/
            .mcp_registry_cache/
          key: bundle-caches-${{ steps.stamp.outputs.value }}-${{ github.run_number }}
          restore-keys: |
            bundle-caches-${{ steps.stamp.outputs.value }}-
            bundle-caches-

      - name: Download catalog (per-entry files + reconcile index.json)
        env:
          # Prefer the PAT (5,000 req/h) over the Actions GITHUB_TOKEN
          # (1,000 req/h): the catalog now carries 1k+ plugin-bundled child
          # entries and the per-repo tree/raw fetches exceed the default
          # budget, stalling the job into the timeout (seen 2026-06-10).
          GITHUB_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          rm -rf -- catalog-download
          TYPES="${{ inputs.services_to_download || 'skills,mcp,rules,prompts,plugins,commands,subagents,templates' }}"
          python -u scripts/download_catalog.py --force --types "$TYPES"

      - name: Build bundle
        run: |
          python -u scripts/build_catalog_bundle.py
          ls -la dist/

      - name: Build registry manifest
        run: |
          python -u scripts/build_registry_manifest.py --verify
          ls -la dist/registry-manifest.json

      - name: Capture bundle metadata
        id: bundle
        run: |
          python <<'PY'
          import hashlib, json, tarfile, os
          path = "dist/catalog-bundle.tar.gz"
          with tarfile.open(path) as t:
              manifest = json.loads(t.extractfile("manifest.json").read())
          size = os.path.getsize(path)
          sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"size={size}\n")
              fh.write(f"sha256={sha}\n")
              fh.write(f"entry_count={manifest['entry_count']}\n")
              fh.write(f"generated_at={manifest['generated_at']}\n")
              fh.write(f"filtered_from={manifest['filtered_from']}\n")
              fh.write(f"index_sha256={manifest['index_sha256']}\n")
          # type_counts is a dict; serialise carefully so release notes
          # show a plain table.
          tc = manifest.get("type_counts", {})
          rows = "\n".join(f"| {k} | {v} |" for k, v in sorted(tc.items()))
          with open("type_counts.md", "w") as fh:
              fh.write("| type | count |\n|------|------:|\n" + rows + "\n")
          PY

      - name: Capture registry manifest metadata
        id: registry-manifest
        run: |
          python <<'PY'
          import hashlib, json, os
          path = "dist/registry-manifest.json"
          with open(path, "rb") as fh:
              payload = fh.read()
          manifest = json.loads(payload)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"sha256={hashlib.sha256(payload).hexdigest()}\n")
              fh.write(f"entry_count={len(manifest['entries'])}\n")
          PY

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="catalog-bundle-manual-$(git rev-parse --short HEAD)"
            # Pre-emptively delete a previous manual release with the same
            # short-SHA so re-running the workflow is idempotent.
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve marketplace version
        id: marketplace-version
        run: |
          REQUESTED="${{ inputs.marketplace_version || '' }}"
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          else
            TAG="${{ steps.tag.outputs.name }}"
            CANDIDATE="${TAG#catalog-bundle-v}"
            if printf '%s' "$CANDIDATE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
              VERSION="$CANDIDATE"
            else
              SAFE_TAG="$(printf '%s' "$TAG" | tr -c 'A-Za-z0-9-' '-' | sed -E 's/^-+//; s/-+$//')"
              VERSION="0.0.0-$SAFE_TAG"
            fi
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Marketplace version: $VERSION"

      - name: Compose release notes
        run: |
          cat > release-notes.md <<EOF
          # Catalog bundle ${{ steps.tag.outputs.name }}

          One-stop, self-contained bundle of \`catalog/index.json\` +
          \`catalog-download/\` packed for downstream ingest (cf. \`scripts/build_catalog_bundle.md\`).

          ## Bundle metadata

          - **Generated at:** \`${{ steps.bundle.outputs.generated_at }}\`
          - **Entries:** \`${{ steps.bundle.outputs.entry_count }}\` (filtered from \`${{ steps.bundle.outputs.filtered_from }}\` raw entries)
          - **Bundle size:** \`${{ steps.bundle.outputs.size }}\` bytes
          - **Bundle sha256:** \`${{ steps.bundle.outputs.sha256 }}\`
          - **index.json sha256:** \`${{ steps.bundle.outputs.index_sha256 }}\`

          ## Entries by type

          $(cat type_counts.md)

          ## Registry manifest

          - **Entries:** \`${{ steps.registry-manifest.outputs.entry_count }}\`
          - **sha256:** \`${{ steps.registry-manifest.outputs.sha256 }}\`
          - **Download:** https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/registry-manifest.json

          ## Consumer usage

          Direct ingest from this release (no git clone required):

          \`\`\`bash
          # On the bastion:
          curl -L -o /tmp/catalog-bundle.tar.gz \\
            https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/catalog-bundle.tar.gz

          # Then on a costrict-web api pod:
          /app/migrate ingest-upstream --source=/tmp/catalog-bundle.tar.gz
          \`\`\`

          ${{ inputs.notes_extra }}
          EOF
          cat release-notes.md

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Idempotent: if a release with this tag exists, replace its asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — uploading bundle with --clobber"
            gh release upload "$TAG" dist/catalog-bundle.tar.gz --clobber
            gh release upload "$TAG" dist/registry-manifest.json --clobber
            gh release edit   "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/catalog-bundle.tar.gz \
              --title "Catalog bundle $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" dist/registry-manifest.json --clobber
          fi
          echo ""
          echo "Done. Download URL:"
          echo "  https://github.com/${{ github.repository }}/releases/download/${TAG}/catalog-bundle.tar.gz"

  publish-plugin-marketplace:
    needs: build-and-release
    if: ${{ github.event_name == 'push' || inputs.publish_plugin_marketplace }}
    uses: costrict-plugins-repo/costrict-plugin-marketplace/.github/workflows/publish-marketplace.yml@main
    with:
      catalog_bundle_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.build-and-release.outputs.release_tag }}/catalog-bundle.tar.gz
      bundle_sha: ${{ needs.build-and-release.outputs.bundle_sha }}
      index_sha: ${{ needs.build-and-release.outputs.index_sha }}
      version: ${{ inputs.marketplace_version || needs.build-and-release.outputs.marketplace_version }}
      publish: true
      create_release: false
    secrets:
      MARKETPLACE_GITHUB_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN }}

  notify-registry-manifest:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      # A dispatch input overrides the configured target so a run can be aimed at a
      # staging consumer. Tag pushes leave it empty and fall back to the secret.
      COSTRICT_MANIFEST_WEBHOOK_URL: ${{ inputs.manifest_webhook_url || secrets.COSTRICT_MANIFEST_WEBHOOK_URL }}
      COSTRICT_MANIFEST_WEBHOOK_SECRET: ${{ secrets.COSTRICT_MANIFEST_WEBHOOK_SECRET }}
    steps:
      - name: Send signed registry manifest webhook
        if: ${{ env.COSTRICT_MANIFEST_WEBHOOK_URL != '' && env.COSTRICT_MANIFEST_WEBHOOK_SECRET != '' }}
        env:
          RELEASE_TAG: ${{ needs.build-and-release.outputs.release_tag }}
          MANIFEST_SHA256: ${{ needs.build-and-release.outputs.manifest_sha }}
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.build-and-release.outputs.release_tag }}/registry-manifest.json
        run: |
          python <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request
          import uuid

          payload = {
              "schema_version": 1,
              "release_tag": os.environ["RELEASE_TAG"],
              "manifest_url": os.environ["MANIFEST_URL"],
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "changed_catalog_ids": [],
              "full_reconcile": True,
          }
          body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
          signature = hmac.new(
              os.environ["COSTRICT_MANIFEST_WEBHOOK_SECRET"].encode("utf-8"),
              body,
              hashlib.sha256,
          ).hexdigest()
          target = os.environ["COSTRICT_MANIFEST_WEBHOOK_URL"]
          if not target.startswith("https://"):
              raise SystemExit(
                  "manifest webhook target must be https; refusing to send a signed "
                  f"payload over {target.split(':', 1)[0]}"
              )
          request = urllib.request.Request(
              target,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "X-Costrict-Signature": f"sha256={signature}",
                  "X-Costrict-Delivery": str(uuid.uuid4()),
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"registry manifest webhook delivered: HTTP {response.status}")
          PY
